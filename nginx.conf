# DNS interno do Docker, com TTL curto. Sem isto o nginx resolve `web` UMA
# vez, no start, e guarda o IP pra sempre -- todo deploy do web dá um IP novo
# ao container e este nginx passa a devolver 502 no fallback, derrubando
# tudo que depende dele em rcaldas.com (inclusive os links curtos) até
# alguém reiniciar. Já aconteceu em produção antes de ser corrigido aqui.
#
# Só o resolver não basta: o nginx só re-resolve quando o host do proxy_pass
# vem de variável -- daí o `set $upstream_app` abaixo.
resolver 127.0.0.11 valid=10s ipv6=off;

# Preserva o que o HAProxy já apurou. Este nginx está atrás dele, então
# $remote_addr aqui é o proxy e $scheme é http (a ponta TLS morreu no
# HAProxy) -- recalcular sobrescreveria o IP real do cliente por um IP
# interno e diria "http" pro app numa requisição que chegou por https.
# O default cobre o acesso direto (dev), onde os cabeçalhos não existem.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_real_ip $fwd_real_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets hasheados pelo build: o nome muda quando o conteudo muda, entao
    # cache eterno e imutavel e' seguro por construcao.
    #
    # O try_files @app aqui NAO e' redundante: o app tambem serve
    # /_next/static/... e, quando alguem abre uma pagina do app por
    # rcaldas.com, os chunks dele passam por aqui. Os nomes carregam hash de
    # conteudo, entao cada build resolve pro lugar certo sem colidir. Sem
    # este fallback, pagina do app aberta pela raiz carrega sem JS.
    location /_next/static/ {
        try_files $uri @app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML: a borda segura por muito tempo (purgamos no deploy), o navegador
    # nao -- senao uma correcao urgente fica presa no cliente por horas.
    #
    # Depende do Browser Cache TTL da zona estar em "Respect Existing
    # Headers": com o default de 4h a Cloudflare reescreve este max-age=60
    # pra 14400 e o controle vira ficcao.
    location / {
        try_files $uri $uri/index.html $uri.html @app;
        add_header Cache-Control "public, max-age=60, s-maxage=31536000";
    }

    # Fallback pro app. E' o que resolve a convivencia entre o site na raiz
    # de rcaldas.com e tudo que ja mora la: links curtos (/[slug]), /monitor,
    # /login, /api... O site serve o que ele TEM; o que ele nao tem cai aqui.
    #
    # Sem isto seria preciso manter no HAProxy uma lista de todos os paths
    # do app -- lista que apodrece na primeira rota nova e quebra em
    # producao sem aviso.
    location @app {
        set $upstream_app web;
        proxy_pass http://$upstream_app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $fwd_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $http_host;

        # O app faz upload e OCR por caminhos que passam por aqui quando
        # alguem entra por rcaldas.com; 60s (default) cortaria no meio.
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
